name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/knowledge-base-builder/${{ github.event.release.tag_name }}
    permissions:
      id-token: write        # OIDC for trusted publishing AND for attestation
      attestations: write    # write the SLSA provenance statement
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: python -m build

      # SLSA provenance for the exact artefacts about to be published. Generated
      # BEFORE upload so what is attested is what ships.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: "dist/*"

      # No `password:` -- supplying one disables OIDC trusted publishing and
      # reverts to a long-lived token, defeating the reason id-token: write and the
      # `pypi` environment were configured at all. The action detects the OIDC
      # credential automatically.
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # release/v1

  attach-xapian-wheels:
    name: Attach Xapian wheels to release
    runs-on: ubuntu-latest
    needs: pypi-publish
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: wheel-*
          path: wheels

      - name: Check out for the SBOM
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Generate a release SBOM
        run: |
          python -m pip install --upgrade pip cyclonedx-bom
          python scripts/generate_sbom.py -o sbom.json

      # An SBOM nobody can retrieve next to the artefact is not evidence.
      - name: Attach wheels and SBOM to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            wheels/**/*
            sbom.json
          fail_on_unmatched_files: false
