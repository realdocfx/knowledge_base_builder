# Mode C -- the QEMU sandbox -- verified where it can actually be verified.
#
# Three things about the sandbox are unverifiable on a Windows workstation, and
# all three are load-bearing:
#
#   1. The guest UI is a Tauri binary linked against musl + WebKitGTK. It cannot
#      be compiled on Windows, so nothing local proves it links at all.
#   2. The guest root is an Alpine filesystem. Assembling it needs apk.
#   3. "The UI comes up" is a claim about a kernel, a compositor and a DRM node.
#      Reading the provisioning code cannot establish it; only booting can.
#
# These jobs are not advisory -- a failure here is a real failure.
#
# The pipeline builds a *self-contained* guest: packages are resolved at build
# time from upstream signed repositories, and the stick ships a finished
# filesystem. The earlier design had the guest install itself at boot from a
# mirror on the medium, which made the boot depend on that repository being
# present, reachable and trusted. It failed on trust -- `apk index` produces an
# unsigned APKINDEX, Alpine's initramfs runs apk without --allow-untrusted, so
# every base install was refused and the root came up empty: "/sbin/init not
# found in new root". Resolving at build time removes the whole class, and is
# also what lets the stick run with no host and no network: there is nothing
# left for the guest to ask anyone for.
name: sandbox

on:
  push:
    paths:
      # pyproject matters here: the guest image pip-installs KBB, so a broken
      # dependency set breaks the image even with cli.py untouched.
      - 'pyproject.toml'
      - 'src/knowledge_base_builder/cli.py'
      - 'launcher/**'
      - '.github/workflows/sandbox.yml'
      - 'tests/test_sandbox_head.py'
      - 'tests/test_guest_root_config.py'
      - 'tests/test_one_click_sandbox.py'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ALPINE_VERSION: "3.20"
  ALPINE_ARCH: x86_64

jobs:
  # ---------------------------------------------------------------------------
  # The overlay's own invariants. Fast, no emulation -- fails in ~30s rather than
  # after a five-minute boot, so a bad overlay is caught before QEMU starts.
  # ---------------------------------------------------------------------------
  overlay:
    name: overlay invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - run: pip install -e . pytest
      - run: >-
          python -m pytest -q
          tests/test_sandbox_head.py tests/test_tactical_provision.py
          tests/test_guest_root_config.py tests/test_one_click_sandbox.py

  # ---------------------------------------------------------------------------
  # The guest's head, mirrored offline.
  #
  # `apk fetch --recursive` walks the real dependency graph, which is the only
  # honest way to know what the guest needs -- a hand-written list drifts the
  # moment Alpine re-organises a package, and the symptom of drift is a stick
  # that boots to a black screen in the field.
  # ---------------------------------------------------------------------------
  apk-closure:
    name: offline package closure
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Resolve and mirror the closure
        run: |
          set -eux
          apk update
          mkdir -p /tmp/apks/${ALPINE_ARCH:-x86_64}
          # Read the package set from the source of truth rather than restating
          # it here; a divergence between CI and the overlay is exactly the bug
          # this job exists to prevent.
          # Import the tuple rather than scraping it. The previous sed matched
          # `GUEST_APK_CLOSURE = (`, which stopped existing the moment that name
          # became an alias for GUEST_WORLD -- so the job silently resolved an
          # empty closure. Scraping source for a value the interpreter can just
          # tell us is the same drift this job exists to catch.
          apk add --no-cache python3
          PKGS=$(python3 -c "
          import ast, sys
          src = open('src/knowledge_base_builder/cli.py', encoding='utf-8').read()
          tree = ast.parse(src)
          names = {}
          for node in tree.body:
              if isinstance(node, ast.Assign) and isinstance(node.targets[0], ast.Name):
                  names[node.targets[0].id] = node.value
          v = names['GUEST_APK_CLOSURE']
          while isinstance(v, ast.Name):
              v = names[v.id]
          print(' '.join(ast.literal_eval(v)))
          ")
          echo "closure roots: $PKGS"
          test -n "$PKGS"
          apk fetch --recursive --output /tmp/apks/x86_64 $PKGS
          apk add --no-cache abuild
          ls /tmp/apks/x86_64 | head -30
          echo "package count: $(ls /tmp/apks/x86_64 | wc -l)"
          # A closure this small means resolution silently failed.
          test "$(ls /tmp/apks/x86_64 | wc -l)" -gt 20

      - name: Build the local index the guest reads
        run: |
          set -eux
          apk add --no-cache alpine-sdk
          cd /tmp/apks/x86_64
          # Unsigned index: the guest mounts the stick read-only and installs with
          # --allow-untrusted. Signing this would need a key on the medium, which
          # is worse than not signing it -- the stick's integrity is established
          # by the SHA-256 manifest, not by an apk key riding alongside the data.
          apk index -o APKINDEX.unsigned.tar.gz *.apk
          mv APKINDEX.unsigned.tar.gz APKINDEX.tar.gz
          du -sh /tmp/apks

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: guest-apks
          path: /tmp/apks
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The guest UI. Same Tauri source as the Windows launcher, linked for musl and
  # rendered by WebKitGTK. If this does not build, the sandbox has no UI and the
  # whole mode is a black screen.
  # ---------------------------------------------------------------------------
  guest-ui:
    name: Tauri UI (alpine/musl)
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Toolchain
        run: |
          set -eux
          # Alpine 3.20's `rust` package cannot parse the manifests of current
          # dependencies (time 0.3.54 and friends use newer Cargo features), so
          # the distro toolchain fails during resolution -- before compiling a
          # line. rustup gives a current stable with a musl host target, which is
          # what the guest binary needs anyway.
          apk add --no-cache \
            build-base rustup \
            webkit2gtk-dev gtk+3.0-dev \
            openssl-dev pkgconf glib-dev cairo-dev pango-dev gdk-pixbuf-dev \
            libsoup-dev librsvg-dev file gettext-dev musl-dev
          rustup-init -y --no-modify-path --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build
        working-directory: launcher
        run: |
          set -eux
          rustc --version
          cargo --version
          # musl targets default to crt-static, which forces every C
          # dependency to be linked as a static archive. WebKitGTK and glib
          # ship no static archives on Alpine, so the link fails with
          # `cannot find -lglib-2.0` even though glib-dev is installed. The
          # guest runs a full Alpine userland, so dynamic linking is correct.
          export RUSTFLAGS="-C target-feature=-crt-static"
          # --locked would pin us to a lockfile resolved by a different toolchain.
          cargo build --release

      - name: Confirm it is a Linux binary that links WebKitGTK
        working-directory: launcher
        run: |
          set -eux
          BIN=$(find target/release -maxdepth 1 -type f -perm -u+x ! -name '*.d' | head -1)
          test -n "$BIN"
          apk add --no-cache file
          file "$BIN" | grep -qi 'ELF 64-bit'
          # The point of the whole exercise: the guest renders through WebKitGTK,
          # not a bundled browser.
          (ldd "$BIN" 2>/dev/null || true) | grep -qi webkit2gtk
          cp "$BIN" /tmp/launch_kbb

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: launch_kbb-alpine-x86_64
          path: /tmp/launch_kbb
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The guest image: a complete Alpine root with the head, the runtime and the
  # Tauri UI already installed.
  #
  # This replaces the netboot + apkovl + offline-mirror arrangement, and the
  # reason is not convenience. That design had the guest *install itself at boot*
  # from a package repository, which means the boot depends on a repository being
  # present, reachable and trusted. It failed on the last of those: `apk index`
  # produces an unsigned APKINDEX, Alpine's initramfs runs apk without
  # --allow-untrusted, so every base install was refused and the root came up
  # empty -- "/sbin/init not found in new root". Signing it properly needs
  # Alpine's own key, which we cannot have.
  #
  # Resolving packages at build time removes the entire class. Here the repos are
  # upstream and genuinely signed, because CI has network. The stick then carries
  # a finished filesystem: nothing to resolve, nothing to trust, nothing to fetch.
  # That is also what makes the stick self-contained -- the guest needs neither
  # the host nor a network, because there is nothing left for it to ask for.
  #
  # Built without privileges: `apk add --root` needs none, and `mke2fs -d`
  # populates a filesystem image from a directory without a loop mount.
  # ---------------------------------------------------------------------------
  guest-image:
    name: guest image (self-contained)
    runs-on: ubuntu-latest
    needs: [guest-ui]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: launch_kbb-alpine-x86_64
          path: ui

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install KBB so the guest config comes from the shipping code
        run: pip install -e . --quiet

      - name: Build the Alpine root
        run: |
          set -eux
          chmod +x ui/launch_kbb
          cat > build-root.sh <<'SCRIPT'
          #!/bin/sh
          # Assemble the guest root with apk-tools from the Alpine container,
          # writing into a plain directory on the runner (no privileges needed).
          #
          # Three things must be in place before `add` works, and omitting any of
          # them yields "no such package" for every package including alpine-base:
          #   - the repositories file must live INSIDE the new root, because that
          #     is where --root makes apk look;
          #   - the signing keys must be copied in, or every index fails
          #     verification and is silently discarded;
          #   - --update-cache must fetch those indexes; with --no-cache there is
          #     no index to select packages from at all.
          #
          # This is also where trust is established: the repositories are upstream
          # and signed, and CI has the network to verify them. The stick ships the
          # result, so the guest never repeats this step and needs no repository.
          set -eux
          R=/work/rootfs
          mkdir -p "$R/etc/apk/keys"
          {
            echo "https://dl-cdn.alpinelinux.org/alpine/v3.20/main"
            echo "https://dl-cdn.alpinelinux.org/alpine/v3.20/community"
          } > "$R/etc/apk/repositories"
          cp /etc/apk/keys/* "$R/etc/apk/keys/"
          apk --root "$R" --initdb --arch x86_64 --update-cache add alpine-base busybox openrc util-linux eudev dbus linux-lts mkinitfs cage seatd mesa-dri-gallium mesa-egl webkit2gtk gtk+3.0 font-dejavu python3 py3-pip
          SCRIPT
          sed -i 's/^          //' build-root.sh
          chmod +x build-root.sh
          docker run --rm -v "$PWD:/work" -w /work alpine:3.20 /work/build-root.sh
          sudo du -sh rootfs

      - name: Install the UI and the kiosk head
        run: |
          set -eux
          # rootfs stays root-owned. It is a Linux root filesystem: chowning it to
          # the runner would hand the guest a / owned by uid 1001, with setuid
          # binaries stripped of their owner. Everything that writes into it runs
          # through sudo instead.
          sudo install -Dm755 ui/launch_kbb rootfs/usr/local/bin/launch_kbb

          # Generate the guest's init config from the shipping code path rather
          # than restating it in YAML, so CI exercises the same bytes the
          # provisioner writes. sudo -E with an explicit interpreter, because
          # `sudo python3` would pick the system python and miss the install.
          sudo -E "$(command -v python)" - <<'PY'
          import pathlib, sys
          sys.path.insert(0, "src")
          from knowledge_base_builder.cli import write_guest_root_config
          write_guest_root_config(pathlib.Path("rootfs"))
          print("guest root configured")
          PY

          # Runlevels come from GUEST_RUNLEVELS in cli.py, not from a list written
          # out here. The previous version hand-wired them and got two things
          # wrong that cost a full CI cycle each: it added mdev alongside udev (two
          # device managers racing over /dev) and omitted udev-trigger (so udev
          # never coldplugged and libinput enumerated an empty database, with the
          # input devices plainly present in dmesg).
          sudo -E "$(command -v python)" - <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, "src")
          from knowledge_base_builder.cli import GUEST_RUNLEVELS, GUEST_FORBIDDEN_SERVICES

          root = "rootfs"
          for runlevel, services in GUEST_RUNLEVELS.items():
              d = os.path.join(root, "etc", "runlevels", runlevel)
              os.makedirs(d, exist_ok=True)
              for svc in services:
                  if not os.path.isfile(os.path.join(root, "etc", "init.d", svc)):
                      print(f"  skip {runlevel}/{svc} (not installed)")
                      continue
                  link = os.path.join(d, svc)
                  if os.path.islink(link) or os.path.exists(link):
                      os.remove(link)
                  os.symlink(f"/etc/init.d/{svc}", link)
                  print(f"  {runlevel}/{svc}")

          # Remove anything explicitly incompatible, wherever Alpine's defaults put it.
          for banned in GUEST_FORBIDDEN_SERVICES:
              for runlevel in os.listdir(os.path.join(root, "etc", "runlevels")):
                  link = os.path.join(root, "etc", "runlevels", runlevel, banned)
                  if os.path.islink(link) or os.path.exists(link):
                      os.remove(link)
                      print(f"  removed {runlevel}/{banned}")
          PY
          sudo find rootfs/etc/runlevels -maxdepth 2 | sort

      - name: Install KBB and its web stack into the guest
        run: |
          set -eux
          # The portal runs INSIDE the guest, so the package and its web stack have
          # to be in the image. Nothing may be fetched at boot: that is the whole
          # point of a self-contained stick.
          #
          # Installed with the guest's own interpreter inside a container, so the
          # wheels selected match musl and the guest's Python minor version rather
          # than the runner's glibc build.
          cat > install-kbb.sh <<'SCRIPT'
          #!/bin/sh
          set -eux
          apk add --no-cache python3 py3-pip
          PYV=$(/work/rootfs/usr/bin/python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
          TARGET="/work/rootfs/usr/lib/python$PYV/site-packages"
          test -d "$TARGET"
          pip install --break-system-packages --no-cache-dir --target "$TARGET" "/work[web]"
          # Prove the guest can import it, using the guest's interpreter.
          PYTHONPATH="$TARGET" /work/rootfs/usr/bin/python3 -c "import knowledge_base_builder, fastapi, uvicorn; print('guest imports ok')"
          SCRIPT
          sed -i 's/^          //' install-kbb.sh
          chmod +x install-kbb.sh
          docker run --rm -v "$PWD:/work" -w /work alpine:3.20 /work/install-kbb.sh
          sudo du -sh rootfs

      - name: Generate an initramfs that can find a virtio root
        run: |
          set -eux
          KVER=$(ls rootfs/lib/modules | head -1)
          echo "kernel: $KVER"
          # mkinitfs runs inside the guest root so the modules it embeds match the
          # kernel that will boot. Without the virtio feature the initramfs cannot
          # see /dev/vda and the kernel panics with no root.
          docker run --rm -v "$PWD/rootfs:/rootfs" alpine:3.20 \
            chroot /rootfs /sbin/mkinitfs -F "base virtio ext4 kms dri" \
              -o "/boot/initramfs-kbb" "$KVER"
          sudo ls -lh rootfs/boot/

      - name: Package the image
        run: |
          set -eux
          # mke2fs -d populates from a directory with no loop mount, but it must
          # run as root to read setuid binaries such as busybox's bbsuid and to
          # preserve ownership into the image.
          sudo /sbin/mke2fs -t ext4 -d rootfs -L KBBGUEST -m 0 -F kbb_guest.img 3G
          sudo /sbin/e2fsck -fn kbb_guest.img || true
          sudo cp rootfs/boot/vmlinuz-lts vmlinuz-kbb
          sudo cp rootfs/boot/initramfs-kbb initramfs-kbb
          sudo chown "$(id -u):$(id -g)" kbb_guest.img vmlinuz-kbb initramfs-kbb
          ls -lh kbb_guest.img vmlinuz-kbb initramfs-kbb

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: kbb-guest-image
          path: |
            kbb_guest.img
            vmlinuz-kbb
            initramfs-kbb
          retention-days: 7
          compression-level: 6

  # ---------------------------------------------------------------------------
  # Does the UI actually come up?
  #
  # Every previous boot assertion checked that the machinery *leading to* the UI
  # ran. None of them checked the UI, which is why a boot ending in an emergency
  # shell once passed. This one waits for the guest to report that the Tauri
  # process is alive, and fails on the markers that mean it is not.
  # ---------------------------------------------------------------------------
  guest-boot:
    name: UI starts in the VM
    runs-on: ubuntu-latest
    needs: [guest-image]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: kbb-guest-image

      - name: Emulation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86

      - name: Boot the guest and wait for the UI
        timeout-minutes: 15
        run: |
          set -eux
          # virtio-vga gives the guest a DRM node. cage is a DRM compositor, so
          # without one it exits instantly -- the runner has no GPU, but virtio-gpu
          # is a real DRM device to the guest regardless of the host display.
          #
          # The input devices are just as necessary, which is not obvious: wlroots
          # aborts with "libinput initialization failed, no input devices" and cage
          # exits, even though nothing types during the test. DRM was present and
          # working when this first failed, so the symptom is indistinguishable
          # from a GPU problem. This invocation has to stay in step with the
          # generated launchers -- a CI boot that differs from the field boot
          # proves nothing about the field.
          timeout 540 qemu-system-x86_64 \
            -M q35 -m 3072 -smp 2 -no-reboot \
            -kernel vmlinuz-kbb -initrd initramfs-kbb \
            -drive file=kbb_guest.img,format=raw,if=virtio \
            -append "root=/dev/vda rootfstype=ext4 rw console=ttyS0 kbb_mode=qemu" \
            -device virtio-vga \
            -device virtio-keyboard-pci -device virtio-tablet-pci \
            -display none -serial stdio \
            2>&1 | tee boot.log || true
          echo "--- tail ---"; tail -60 boot.log

      - name: Assert the UI started
        run: |
          set -eux
          if grep -qiE "emergency|init not found|Kernel panic" boot.log; then
            echo "::error::guest did not reach userspace"
            grep -iE -B3 "emergency|init not found|Kernel panic" boot.log | tail -12
            exit 1
          fi
          # cage must have claimed the DRM device.
          grep -qa "KBB-HEAD-STARTED" boot.log || {
            echo "::error::cage did not start -- no compositor, so no window"
            grep -a "KBB-" boot.log || true
            exit 1
          }
          # ...and the Tauri process must still be alive after it.
          grep -qa "KBB-UI-ALIVE" boot.log || {
            echo "::error::the Tauri UI did not stay running"
            grep -a "KBB-" boot.log || true
            exit 1
          }
          # ...and the portal must have finished starting, not merely begun.
          # "Waiting for application startup" is uvicorn's *first* line; a boot
          # that stops there has a UI pointed at a socket nobody is listening on.
          grep -qa "Application startup complete" boot.log || {
            echo "::error::the portal never finished starting"
            grep -aiE "uvicorn|portal|Traceback|Errno" boot.log | tail -20
            exit 1
          }
          # ...and it must actually answer. The guest curls its own portal and
          # echoes the status, because a listening socket is not a working app.
          grep -qa "KBB-PORTAL-OK" boot.log || {
            echo "::error::the portal is listening but did not serve a page"
            grep -a "KBB-PORTAL" boot.log || true
            exit 1
          }
          echo "Tauri UI running and portal serving inside the VM"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: guest-boot-log
          path: boot.log
          retention-days: 7
