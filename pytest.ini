[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v
# Make the suite runnable from a clean clone with no prior `pip install -e .`.
# Without this, pytest on a fresh checkout dies with
# ModuleNotFoundError: knowledge_base_builder. That gap is how a NameError in the
# primary `pull` command shipped unnoticed: a local editable install masked it,
# and no CI job ever ran the tests from a clean tree.
pythonpath = src
