[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-base-builder"
version = "0.5.0"
description = "Mathematically perfect knowledge base local manager"
readme = "README.md"
requires-python = ">=3.9"
license = "CC0-1.0"
license-files = ["LICENSE"]
authors = [
    {name = "M. François-Xavier 'Doc FX' Briollais"},
]
keywords = [
    "internet-archive",
    "wikipedia",
    "zim",
    "openzim",
    "knowledge-base",
    "offline",
    "sync",
    "cli",
    "usb",
    "wikimedia",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Archiving",
    "Topic :: Utilities",
]
dependencies = [
    "internetarchive[speedups]>=3.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "libzim>=3.0.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "httpx>=0.24.0",
    "pymupdf>=1.24.0",  # server-side PDF-to-PNG rendering (WebKitGTK freezes
                        # on any client-side approach; PyMuPDF renders pages as
                        # images the browser displays as plain <img> tags)
]
# Xapian is deliberately NOT in [web]. `xapian-bindings` on PyPI is an unrelated
# stub at 0.0.x, so ">=1.4.0" cannot be satisfied from an index and
# `pip install knowledge-base-builder[web]` fails outright -- the portal is not
# optional, so that made the package uninstallable for its main use. Local search
# is SQLite FTS5 and needs none of this; real Xapian bindings come from the
# distro package or the wheels built by .github/workflows/build-xapian-wheels.yml.
xapian = [
    "xapian-bindings>=1.4.0",
]
sandbox = [
    "pycdlib>=1.14.0",  # Pure-Python ISO 9660 builder for media image provisioning
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "build>=0.10.0",
    "twine>=4.0.0",
    "tomli>=2.0.0; python_version<'3.11'",
    "pip-tools>=7.0.0",
    "cyclonedx-bom>=4.0.0",
    "pycdlib>=1.14.0",  # needed by sandbox provisioning tests
]

[project.urls]
Homepage = "https://github.com/realdocfx/knowledge_base_builder"
Repository = "https://github.com/realdocfx/knowledge_base_builder"
Issues = "https://github.com/realdocfx/knowledge_base_builder/issues"
Changelog = "https://github.com/realdocfx/knowledge_base_builder/releases"

[project.scripts]
kb-builder = "knowledge_base_builder.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# assets/* vendors swagger-ui so /docs renders with no CDN (airgapped drives).
knowledge_base_builder = ["docs/*.md", "assets/*", "assets/pdfjs/**/*"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
